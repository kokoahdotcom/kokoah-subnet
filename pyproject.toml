[project]
name = "kokoah-subnet"
version = "0.0.1"
description = "Kokoah's Bittensor subnet: the incentive mechanism, validator and miner."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "bittensor==11.3.0",
  "coincurve==21.0.0",
  "cryptography==44.0.0",
  "eth-account==0.13.7",
  "fastapi==0.148.0",
  "httpx==0.28.1",
  "lz4==4.4.4",
  "msgpack==1.1.0",
  "psycopg[binary]==3.2.9",
  "pyjwt==2.10.1",
  "sqlalchemy==2.0.41",
  "uvicorn==0.54.0",
  "zxcvbn==4.5.0",
]

[project.scripts]
kokoah-subnet = "kokoah_subnet.cli:main"

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kokoah_subnet"]

[tool.ruff]
line-length = 120
target-version = "py312"
# The docs are prose; their code snippets are quotes, not code of this repo.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
