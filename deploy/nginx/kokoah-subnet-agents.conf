# Publishing the owner's agent service (127.0.0.1:48130) at https://<api host>/miners: goes inside the API host's
# `server { listen 443 ... }` block. The request limit zone goes in the http block (conf.d):
#   limit_req_zone $binary_remote_addr zone=kokoah_subnet_agents:10m rate=5r/s;
location /miners/ {
    limit_req zone=kokoah_subnet_agents burst=20 nodelay;
    proxy_pass http://127.0.0.1:48130/;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
    client_max_body_size 28m;  # a 20 MiB bundle, base64
}
