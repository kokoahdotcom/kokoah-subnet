# Public exposure of a validator's read-only interface and leaderboard (optional). Put TLS termination in front
# as usual (certbot or a managed certificate); the interface itself stays on the loopback port.
limit_req_zone $binary_remote_addr zone=kokoah_subnet:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name subnet.example.com;  # your host name
    # ssl_certificate / ssl_certificate_key as usual

    location / {
        limit_req zone=kokoah_subnet burst=40 nodelay;
        proxy_pass http://127.0.0.1:48100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=60";
    }
}
