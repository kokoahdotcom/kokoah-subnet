name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release runs these same jobs first (release.yml)
# No token scope by default; the job asks only for what it needs.
permissions: {}
# bash with pipefail: a failing command in a pipe fails its step
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # Actions pinned by commit; the token is not kept in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.19"
          python-version: "3.12"
      - run: scripts/check.sh

  sandbox:
    # The agent sandbox's tests that switch users and make namespaces need root, and on Ubuntu 24.04 AppArmor must
    # let the agent's user make its own user namespace. Every one of them runs here: a test that would skip fails.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.19"
          python-version: "3.12"
      - run: uv sync --locked --quiet
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: sudo env KOKOAH_SANDBOX_TESTS=required .venv/bin/python -m pytest -q -rs -p no:cacheprovider tests/test_agent_sandbox.py

  image:
    # The validator image builds, and its commands start the way compose.yml runs them: read-only, as the service
    # user, with the updater's tools.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --file deploy/validator/Dockerfile --build-arg COMMIT="$GITHUB_SHA" --tag kokoah-subnet:ci .
      - name: the image's commands
        run: |
          run() { docker run --rm --read-only --tmpfs /tmp -e HOME=/tmp --user 998:998 "$@"; }
          run kokoah-subnet:ci validator ready --help >/dev/null
          run kokoah-subnet:ci validator update hop --help >/dev/null
          run --entrypoint python kokoah-subnet:ci -c "import kokoah_subnet.validator.loop, kokoah_subnet.validator.serve"
          run --entrypoint docker kokoah-subnet:ci compose version
          run --entrypoint cosign kokoah-subnet:ci version
          run --entrypoint cat kokoah-subnet:ci /opt/kokoah-subnet/compose.yml | cmp - deploy/validator/compose.yml
      - name: the image's compose file, checked by the compose that will run it
        run: |
          mkdir -p "$RUNNER_TEMP/etc" "$RUNNER_TEMP/project"
          touch "$RUNNER_TEMP/etc/db.env" "$RUNNER_TEMP/etc/db-reader.env" "$RUNNER_TEMP/etc/validator-main.env"
          printf 'KOKOAH_UID=998\nKOKOAH_GID=998\nCOMPOSE_PROFILES=interface\n' > "$RUNNER_TEMP/project/.env"
          compose() {
            docker run --rm -v "$RUNNER_TEMP/etc:/etc/kokoah-subnet:ro" -v "$RUNNER_TEMP/project:/project:ro" \
              --entrypoint docker kokoah-subnet:ci compose --project-directory /project -f /opt/kokoah-subnet/compose.yml "$@"
          }
          compose config --quiet
          test "$(compose config --services | sort | tr '\n' ' ')" = "check interface updater validator "
